name: "nix-magic-setup"
description: "Github Actions to setup Nix and related tooling in an opinionated way"
branding:
  icon: "box"
  color: "blue"
inputs:
  token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}
  free-up-all-storage:
    description: "Reclaim maximum runner disk space before installing Nix (removes pre-installed runtimes)"
    required: false
    default: "false"
  max-cached-store-size:
    description: "Max uncompressed Nix store size to cache, e.g. 8G. `auto` sizes it from free disk space; empty disables GC"
    required: false
    default: "auto"
runs:
  using: composite
  steps:
    - name: Free up storage
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: ${{ inputs.free-up-all-storage == 'true' && 'rampage' || 'holster' }}

    # After freeing storage, so `auto` sees the final free space.
    - name: Configure Nix cache
      id: cache-config
      shell: bash
      env:
        MAX_STORE_SIZE: ${{ inputs.max-cached-store-size }}
        PRIMARY_KEY: nix-${{ runner.os }}-${{ inputs.max-cached-store-size }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      run: bash "${{ github.action_path }}/scripts/setup-nix-cache.sh"

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.token }}

    - name: Setup nixConfig from flake.nix
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-nixconfig.sh"

    - name: Snapshot Nix store before cache restore
      shell: bash
      run: bash "${{ github.action_path }}/scripts/cache-stats.sh" pre-restore

    # Post steps run in reverse order, so this one runs after cache-nix-action saves.
    - name: Report Nix cache stats
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        NMS_TOKEN: ${{ inputs.token }}
      with:
        key: NMS_CACHE_STATS_REPORT
        main: echo "Nix cache stats are reported after the job's remaining steps"
        post: bash "${{ github.action_path }}/scripts/cache-stats.sh" report

    - name: Setup Nix Cache
      id: nix-cache
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        nix: true
        save: true
        primary-key: ${{ steps.cache-config.outputs.primary-key }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size: ${{ steps.cache-config.outputs.gc-max-store-size }}
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-primary-key: never
        purge-last-accessed: "P14D"
        token: ${{ inputs.token }}

    - name: Snapshot Nix store after cache restore
      shell: bash
      env:
        CACHE_HIT_PRIMARY_KEY: ${{ steps.nix-cache.outputs.hit-primary-key }}
        CACHE_HIT_FIRST_MATCH: ${{ steps.nix-cache.outputs.hit-first-match }}
        CACHE_PRIMARY_KEY: ${{ steps.cache-config.outputs.primary-key }}
        CACHE_RESTORED_KEY: ${{ steps.nix-cache.outputs.restored-key }}
      run: bash "${{ github.action_path }}/scripts/cache-stats.sh" post-restore

    # Post step runs before cache-nix-action's GC and save.
    - name: Capture Nix store for cache stats
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        NMS_TOKEN: ${{ inputs.token }}
      with:
        key: NMS_CACHE_STATS_CAPTURE
        main: echo "The Nix store is captured for cache stats after the job's remaining steps"
        post: bash "${{ github.action_path }}/scripts/cache-stats.sh" pre-save

    - name: Check for .envrc
      id: check-envrc
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.envrc" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup direnv shell
      if: steps.check-envrc.outputs.exists == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-direnv.sh"
