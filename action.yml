name: "nix-magic-setup"
description: "Github Actions to setup Nix and related tooling in an opinionated way"
branding:
  icon: "box"
  color: "blue"
inputs:
  token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}
  free-up-all-storage:
    description: "Reclaim maximum runner disk space before installing Nix (removes pre-installed runtimes)"
    required: false
    default: "false"
  cache-action:
    description: "Nix cache backend: `cache-nix-action` or `hestia`"
    required: false
    default: "cache-nix-action"
runs:
  using: composite
  steps:
    - name: Check inputs
      if: inputs.cache-action != 'cache-nix-action' && inputs.cache-action != 'hestia'
      shell: bash
      env:
        CACHE_ACTION: ${{ inputs.cache-action }}
      run: |
        echo "::error::Unknown cache-action '$CACHE_ACTION', expected 'cache-nix-action' or 'hestia'"
        exit 1

    - name: Free up storage
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: ${{ inputs.free-up-all-storage == 'true' && 'rampage' || 'holster' }}

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.token }}

    - name: Setup nixConfig from flake.nix
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-nixconfig.sh"

    - name: Setup Nix Cache
      if: inputs.cache-action == 'cache-nix-action'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        nix: true
        save: true
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size: 2G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-primary-key: never
        purge-last-accessed: "P14D"
        token: ${{ inputs.token }}

    # Registered before hestia so its post step (gc) runs after hestia's upload.
    - name: Schedule hestia gc
      if: inputs.cache-action == 'hestia'
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      with:
        key: NMS_HESTIA_GC
        main: "true"
        post: |
          bash "${{ github.action_path }}/scripts/hestia-gc.sh" || echo "::warning::hestia gc failed; does the job have 'actions: write'?"

    # Caches Nix already trusts can serve their paths, so hestia skips storing them.
    - name: Find hestia upstream caches
      id: hestia-upstream
      if: inputs.cache-action == 'hestia'
      shell: bash
      run: |
        keys=$(nix --extra-experimental-features nix-command config show trusted-public-keys)
        echo "key-names=$(sed -E 's/:[^ ]*//g' <<< "$keys")" >> "$GITHUB_OUTPUT"

    - name: Setup Nix Cache (hestia)
      if: inputs.cache-action == 'hestia'
      uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      with:
        # Keep in sync with the ref above; the default, "latest", can pick a pre-release.
        version: v3.1.0
        github-token: ${{ inputs.token }}
        upstream-cache-filter: "true"
        upstream-cache-key-names: ${{ steps.hestia-upstream.outputs.key-names }}

    - name: Check for .envrc
      id: check-envrc
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.envrc" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup direnv shell
      if: steps.check-envrc.outputs.exists == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-direnv.sh"
