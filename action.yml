name: "nix-magic-setup"
description: "Github Actions to setup Nix and related tooling in an opinionated way"
branding:
  icon: "box"
  color: "blue"
inputs:
  token:
    description: "Github authentication token to use"
    required: false
    default: ${{ github.token }}
  free-up-all-storage:
    description: "Aggressively free up all possible disk space on the runner before installing Nix, using wimpysworld/nothing-but-nix. When false, a minimal amount of space is still reclaimed"
    required: false
    default: "false"
  max-cached-store-size:
    description: "Maximum uncompressed Nix store size to keep in the cache (e.g. 8G, 512M); an empty string disables garbage collection; \"auto\" (the default) sizes it from the runner's free disk space. See the Cache size section in the README."
    required: false
    default: "auto"
  changelog-filter:
    description: "Shell command forwarded to comment-flake-lock-changelog's build-filter, to hide flake.lock changelog commits that don't affect your build output. See comment-flake-lock-changelog's README."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Free up storage
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: ${{ inputs.free-up-all-storage == 'true' && 'rampage' || 'holster' }}

    # Runs right after storage is freed, so "auto" reflects the disk space this
    # job actually has to work with rather than the runner's pristine state.
    # Every other step below reads its result instead of inputs.max-cached-store-size
    # directly - see the Cache size section in the README for the heuristic.
    - name: Determine cache size
      id: cache-size
      shell: bash
      run: bash "${{ github.action_path }}/scripts/detect-cache-size.sh" "${{ inputs.max-cached-store-size }}"

    - name: Install Nix
      uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      with:
        github_access_token: ${{ inputs.token }}

    - name: Setup nixConfig from flake.nix
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-nixconfig.sh"

    # Runs here, before the cache is restored: comment-flake-lock-changelog's
    # build-filter always garbage-collects between builds, and the store is still
    # essentially empty at this point (just the Nix installation), so that GC can't
    # collect away anything the rest of the job needs. Running this after cache
    # restore would risk gc'ing the cache that was just restored.
    #
    # Pinned to main rather than a tagged release: build-filter is still pre-release
    # (tracked in comment-flake-lock-changelog#301). Bump this SHA when main moves;
    # switch to a version tag once a release ships. build-filter no longer touches
    # the filesystem via git at all (no local checkout, no worktrees) - it only ever
    # sets CFLC_INPUT (a flake reference for the commit under test) and CFLC_INPUT_NAME
    # (that input's name, for a command that needs to stay input-agnostic) on the
    # build command's environment.
    - uses: mdarocha/comment-flake-lock-changelog@1eaec83cb9ac72942999c229808e831921f515c3 # main
      if: github.event_name == 'pull_request'
      with:
        pull-request-number: ${{ github.event.pull_request.number }}
        build-filter: ${{ inputs.changelog-filter }}
        token: ${{ inputs.token }}

    - name: Snapshot Nix store before cache restore
      shell: bash
      run: bash "${{ github.action_path }}/scripts/cache-stats-snapshot.sh" pre

    # Registered BEFORE the cache step so its post step runs AFTER
    # cache-nix-action's save (post steps run in reverse registration order).
    # That lets the report observe the save outcome and query the Actions Cache
    # API for cache sizes. Composite actions can't declare a post step of their
    # own, so this borrows one via with-post-step.
    - name: Report cache stats after build
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        NMS_TOKEN: ${{ inputs.token }}
      with:
        key: NMS_REPORT
        main: 'echo "nix-magic-setup: Nix cache stats will be reported in the post step, after the build."'
        post: 'bash "${{ github.action_path }}/scripts/cache-stats-report.sh"'

    - name: Setup Nix Cache
      id: nix-cache
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        nix: true
        save: true
        primary-key: nix-${{ runner.os }}-${{ steps.cache-size.outputs.value }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size: ${{ steps.cache-size.outputs.value }}
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-primary-key: never
        purge-last-accessed: "P14D"
        token: ${{ inputs.token }}

    - name: Snapshot Nix store after cache restore
      shell: bash
      env:
        CACHE_HIT_PRIMARY_KEY: ${{ steps.nix-cache.outputs.hit-primary-key }}
        CACHE_HIT_FIRST_MATCH: ${{ steps.nix-cache.outputs.hit-first-match }}
        # cache-nix-action doesn't expose `primary-key` as a real step output in
        # this combined restore+save usage (it only persists it as internal
        # cross-phase state), so it's always empty - use the same literal key
        # expression given to its `primary-key` input above instead. (A YAML
        # anchor/alias would avoid this duplication, but GitHub's action.yml
        # parser rejects anchors outright, so it has to be spelled out here
        # and in the "Capture Nix store after build" step below - keep both
        # in sync with the `primary-key:` input above if this ever changes.)
        CACHE_PRIMARY_KEY: nix-${{ runner.os }}-${{ steps.cache-size.outputs.value }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        CACHE_RESTORED_KEY: ${{ steps.nix-cache.outputs.restored-key }}
      run: bash "${{ github.action_path }}/scripts/cache-stats-snapshot.sh" post

    # Registered AFTER the cache step so its post step runs BEFORE
    # cache-nix-action's garbage collection and save. That captures the full
    # built store for the per-derivation breakdown, before any paths are
    # collected away.
    - name: Capture Nix store after build
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        NMS_TOKEN: ${{ inputs.token }}
        CACHE_PRIMARY_KEY: nix-${{ runner.os }}-${{ steps.cache-size.outputs.value }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      with:
        key: NMS_CAPTURE
        main: 'echo "nix-magic-setup: will capture the Nix store after the build for cache stats."'
        post: 'bash "${{ github.action_path }}/scripts/cache-stats-capture.sh"'

    - name: Check for .envrc
      id: check-envrc
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.envrc" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup direnv shell
      if: steps.check-envrc.outputs.exists == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-direnv.sh"
