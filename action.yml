name: "nix-magic-setup"
description: "Github Actions to setup Nix and related tooling in an opinionated way"
branding:
  icon: "box"
  color: "blue"
inputs:
  token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}
  free-up-all-storage:
    description: "Reclaim maximum runner disk space before installing Nix (removes pre-installed runtimes)"
    required: false
    default: "false"
  max-cached-store-size:
    description: "Maximum uncompressed Nix store size to cache (e.g. 8G, 512M). Set empty to disable GC, or auto to size from free disk"
    required: false
    default: "auto"
runs:
  using: composite
  steps:
    - name: Free up storage
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: ${{ inputs.free-up-all-storage == 'true' && 'rampage' || 'holster' }}

    # Sized after storage cleanup so auto uses actual available disk space.
    - name: Determine cache size
      id: cache-size
      shell: bash
      run: bash "${{ github.action_path }}/scripts/detect-cache-size.sh" "${{ inputs.max-cached-store-size }}"

    - name: Install Nix
      uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      with:
        github_access_token: ${{ inputs.token }}

    - name: Setup nixConfig from flake.nix
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-nixconfig.sh"

    - name: Snapshot Nix store before cache restore
      shell: bash
      run: bash "${{ github.action_path }}/scripts/cache-stats-snapshot.sh" pre

    # Runs in post phase after cache save to report stats and sizes.
    - name: Report cache stats after build
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        NMS_TOKEN: ${{ inputs.token }}
      with:
        key: NMS_REPORT
        main: 'echo "nix-magic-setup: Nix cache stats will be reported in the post step, after the build."'
        post: 'bash "${{ github.action_path }}/scripts/cache-stats-report.sh"'

    - name: Setup Nix Cache
      id: nix-cache
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        nix: true
        save: true
        primary-key: nix-${{ runner.os }}-${{ steps.cache-size.outputs.value }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size: ${{ steps.cache-size.outputs.value }}
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-primary-key: never
        purge-last-accessed: "P14D"
        token: ${{ inputs.token }}

    - name: Snapshot Nix store after cache restore
      shell: bash
      env:
        CACHE_HIT_PRIMARY_KEY: ${{ steps.nix-cache.outputs.hit-primary-key }}
        CACHE_HIT_FIRST_MATCH: ${{ steps.nix-cache.outputs.hit-first-match }}
        CACHE_PRIMARY_KEY: nix-${{ runner.os }}-${{ steps.cache-size.outputs.value }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        CACHE_RESTORED_KEY: ${{ steps.nix-cache.outputs.restored-key }}
      run: bash "${{ github.action_path }}/scripts/cache-stats-snapshot.sh" post

    # Runs in post phase before cache save to capture built paths before GC.
    - name: Capture Nix store after build
      uses: pyTooling/Actions/with-post-step@fdcb8e6fb145f72c8e2c9c3ff6160dc62cc3e22c # v7.9.0
      env:
        NMS_TOKEN: ${{ inputs.token }}
        CACHE_PRIMARY_KEY: nix-${{ runner.os }}-${{ steps.cache-size.outputs.value }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      with:
        key: NMS_CAPTURE
        main: 'echo "nix-magic-setup: will capture the Nix store after the build for cache stats."'
        post: 'bash "${{ github.action_path }}/scripts/cache-stats-capture.sh"'

    - name: Check for .envrc
      id: check-envrc
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.envrc" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup direnv shell
      if: steps.check-envrc.outputs.exists == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-direnv.sh"
