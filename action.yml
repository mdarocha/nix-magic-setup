name: "nix-magic-setup"
description: "Github Actions to setup Nix and related tooling in an opinionated way"
branding:
  icon: "box"
  color: "blue"
inputs:
  token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}
  free-up-all-storage:
    description: "Reclaim maximum runner disk space before installing Nix (removes pre-installed runtimes)"
    required: false
    default: "false"
  cache-action:
    description: "Nix binary cache backend to use: `cache-nix-action` (nix-community/cache-nix-action) or `hestia` (Mic92/hestia)"
    required: false
    default: "cache-nix-action"
runs:
  using: composite
  steps:
    - name: Free up storage
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: ${{ inputs.free-up-all-storage == 'true' && 'rampage' || 'holster' }}

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.token }}

    - name: Setup nixConfig from flake.nix
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-nixconfig.sh"

    - name: Setup Nix Cache
      if: inputs.cache-action == 'cache-nix-action'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        nix: true
        save: true
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size: 2G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-primary-key: never
        purge-last-accessed: "P14D"
        token: ${{ inputs.token }}

    - name: Determine hestia upstream cache keys
      id: hestia-upstream-keys
      if: inputs.cache-action == 'hestia'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-hestia-upstream.sh"

    - name: Setup Nix Cache (hestia)
      if: inputs.cache-action == 'hestia'
      uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      with:
        github-token: ${{ inputs.token }}
        upstream-cache-filter: "true"
        upstream-cache-key-names: ${{ steps.hestia-upstream-keys.outputs.key-names }}

    - name: Run hestia gc
      if: inputs.cache-action == 'hestia'
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "${{ github.action_path }}/scripts/setup-hestia-gc.sh"

    - name: Check for .envrc
      id: check-envrc
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.envrc" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup direnv shell
      if: steps.check-envrc.outputs.exists == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-direnv.sh"
