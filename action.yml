name: "nix-magic-setup"
description: "Github Actions to setup Nix and related tooling in an opinionated way"
branding:
  icon: "box"
  color: "blue"
inputs:
  token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}
  free-up-all-storage:
    description: "Reclaim maximum runner disk space before installing Nix (removes pre-installed runtimes)"
    required: false
    default: "false"
  cache-action:
    description: "Nix cache backend: `cache-nix-action` or `hestia`"
    required: false
    default: "cache-nix-action"
  max-cached-store-size:
    description: "Max Nix store size cache-nix-action saves, e.g. `8G`; `auto` sizes it from free disk space"
    required: false
    default: "auto"
  hestia-gc:
    description: "Run `hestia gc` after this job on the default branch; set it in exactly one job"
    required: false
    default: "false"
  steps:
    description: "Newline- or comma-separated steps to run: `free-up-storage`, `install-nix`, `nix-config`, `cache`, `direnv`; all if empty"
    required: false
    default: ""
  skip:
    description: "Newline- or comma-separated steps not to run, from the same list as `steps`"
    required: false
    default: ""
  nix-distribution:
    description: "Nix to install: `nix` (upstream Nix) or `determinate` (Determinate Nix)"
    required: false
    default: "nix"
runs:
  using: composite
  steps:
    - name: Check inputs
      if: inputs.cache-action != 'cache-nix-action' && inputs.cache-action != 'hestia'
      shell: bash
      env:
        CACHE_ACTION: ${{ inputs.cache-action }}
      run: |
        echo "::error::Unknown cache-action '$CACHE_ACTION', expected 'cache-nix-action' or 'hestia'"
        exit 1

    - name: Select steps
      id: select
      shell: bash
      env:
        STEPS: ${{ inputs.steps }}
        SKIP: ${{ inputs.skip }}
        NIX_DISTRIBUTION: ${{ inputs.nix-distribution }}
      run: bash "${{ github.action_path }}/scripts/select-steps.sh"

    # It feeds both free-up-storage and the cache.
    - name: Plan storage
      id: storage
      if: steps.select.outputs.free-up-storage == 'true' || steps.select.outputs.cache == 'true'
      shell: bash
      env:
        CACHE_ACTION: ${{ inputs.cache-action }}
        MAX_STORE_SIZE: ${{ inputs.max-cached-store-size }}
        FILES_HASH: ${{ hashFiles('**/*.nix', '**/flake.lock') }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/scripts/plan-storage.sh"

    - name: Free up storage
      if: steps.select.outputs.free-up-storage == 'true'
      uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      with:
        hatchet-protocol: ${{ inputs.free-up-all-storage == 'true' && 'rampage' || 'holster' }}
        root-safe-haven: ${{ steps.storage.outputs.root-safe-haven }}
        mnt-safe-haven: ${{ steps.storage.outputs.mnt-safe-haven }}

    - name: Install Nix
      if: steps.select.outputs.install-nix == 'true' && inputs.nix-distribution == 'nix'
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        github_access_token: ${{ inputs.token }}

    - name: Install Determinate Nix
      if: steps.select.outputs.install-nix == 'true' && inputs.nix-distribution == 'determinate'
      uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      with:
        github-token: ${{ inputs.token }}

    - name: Setup nixConfig from flake.nix
      if: steps.select.outputs.nix-config == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-nixconfig.sh"

    # Its post step runs last, after the cache is saved.
    - name: Nix cache stats (before cache setup)
      if: steps.select.outputs.cache == 'true'
      uses: pyTooling/Actions/with-post-step@6d15804199dbbbc94f8c839f85eb6eeee82f3b7b # v9.3.1
      env:
        CACHE_ACTION: ${{ inputs.cache-action }}
        GITHUB_TOKEN: ${{ inputs.token }}
        JOB_STATUS: ${{ job.status }}
      with:
        key: NMS_CACHE_STATS_BEFORE
        main: |
          bash "${{ github.action_path }}/scripts/cache-stats.sh" start || echo "::warning::Nix cache stats failed"
        post: |
          bash "${{ github.action_path }}/scripts/cache-stats.sh" report || echo "::warning::Nix cache stats failed"

    - name: Setup Nix Cache
      id: cache-nix-action
      if: steps.select.outputs.cache == 'true' && inputs.cache-action == 'cache-nix-action'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        nix: true
        save: true
        primary-key: ${{ steps.storage.outputs.primary-key }}
        restore-prefixes-first-match: ${{ steps.storage.outputs.key-prefix }}
        gc-max-store-size: ${{ steps.storage.outputs.gc-max-store-size }}
        purge: true
        purge-prefixes: ${{ steps.storage.outputs.key-prefix }}
        purge-primary-key: never
        purge-last-accessed: "P14D"
        token: ${{ inputs.token }}

    # Registered before hestia so its post step (gc) runs after hestia's upload.
    - name: Schedule hestia gc
      if: steps.select.outputs.cache == 'true' && inputs.cache-action == 'hestia'
      uses: pyTooling/Actions/with-post-step@6d15804199dbbbc94f8c839f85eb6eeee82f3b7b # v9.3.1
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        HESTIA_GC: ${{ inputs.hestia-gc }}
      with:
        key: NMS_HESTIA_GC
        main: "true"
        post: |
          bash "${{ github.action_path }}/scripts/hestia-gc.sh" || echo "::warning::hestia gc failed; does the job have 'actions: write'?"

    # Caches Nix already trusts can serve their paths, so hestia skips storing them.
    - name: Find hestia upstream caches
      id: hestia-upstream
      if: steps.select.outputs.cache == 'true' && inputs.cache-action == 'hestia'
      shell: bash
      run: |
        keys=$(nix --extra-experimental-features nix-command config show trusted-public-keys)
        echo "key-names=$(sed -E 's/:[^ ]*//g' <<< "$keys")" >> "$GITHUB_OUTPUT"

    - name: Setup Nix Cache (hestia)
      if: steps.select.outputs.cache == 'true' && inputs.cache-action == 'hestia'
      uses: mdarocha/hestia@0f8ce82806e107d3bcf24496ae8710b28d6029b7 # v3.1.0-mdarocha.1
      with:
        # Keep in sync with the ref above; the default, "latest", can pick a pre-release.
        version: v3.1.0-mdarocha.1
        github-token: ${{ inputs.token }}
        upstream-cache-filter: "true"
        upstream-cache-key-names: ${{ steps.hestia-upstream.outputs.key-names }}

    # Its post step runs before the cache's post steps, including cache-nix-action's GC.
    - name: Nix cache stats (after cache setup)
      if: steps.select.outputs.cache == 'true'
      uses: pyTooling/Actions/with-post-step@6d15804199dbbbc94f8c839f85eb6eeee82f3b7b # v9.3.1
      env:
        CACHE_ACTION: ${{ inputs.cache-action }}
        GITHUB_TOKEN: ${{ inputs.token }}
        PRIMARY_KEY: ${{ steps.storage.outputs.primary-key }}
        RESTORED_KEY: ${{ steps.cache-nix-action.outputs.restored-key }}
        HIT_PRIMARY_KEY: ${{ steps.cache-nix-action.outputs.hit-primary-key }}
        HIT_FIRST_MATCH: ${{ steps.cache-nix-action.outputs.hit-first-match }}
      with:
        key: NMS_CACHE_STATS_AFTER
        main: |
          bash "${{ github.action_path }}/scripts/cache-stats.sh" restored || echo "::warning::Nix cache stats failed"
        post: |
          bash "${{ github.action_path }}/scripts/cache-stats.sh" finish || echo "::warning::Nix cache stats failed"

    - name: Check for .envrc
      id: check-envrc
      if: steps.select.outputs.direnv == 'true'
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/.envrc" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup direnv shell
      if: steps.select.outputs.direnv == 'true' && steps.check-envrc.outputs.exists == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-direnv.sh"
