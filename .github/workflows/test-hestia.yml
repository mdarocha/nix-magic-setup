name: test-hestia
on:
  workflow_dispatch:
  push:
    branches: [test-fix-base]

permissions:
  contents: read
  actions: write

env:
  PROBE: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        free-up-all-storage: ["false", "true"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          cache-action: hestia
          free-up-all-storage: ${{ matrix.free-up-all-storage }}
      - name: Build probe
        run: |
          nix build --impure -L --no-link --expr 'with (builtins.getFlake "nixpkgs").legacyPackages.x86_64-linux; runCommand "hestia-probe-${builtins.getEnv "PROBE"}" {} "echo hi > $out"'

  substitute:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        free-up-all-storage: ["false", "true"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          cache-action: hestia
          free-up-all-storage: ${{ matrix.free-up-all-storage }}
      - name: Debug nix config
        run: |
          echo "NIX_CONFIG=$NIX_CONFIG"
          cat "${NIX_USER_CONF_FILES%%:*}"
          for k in substituters trusted-substituters trusted-users trusted-public-keys; do echo "$k = $(nix config show $k)"; done
          id; cat /etc/nix/nix.conf
          out=$(nix eval --impure --raw --expr 'with (builtins.getFlake "nixpkgs").legacyPackages.x86_64-linux; (runCommand "hestia-probe-${builtins.getEnv "PROBE"}" {} "echo hi > $out").outPath')
          echo "probe out=$out"
          h=$(basename "$out" | cut -c1-32)
          curl -sS -i "http://$HESTIA_LISTEN/$h.narinfo" | head -20 || true
      - name: Substitute probe
        run: |
          nix build --impure -L --no-link --max-jobs 0 --expr 'with (builtins.getFlake "nixpkgs").legacyPackages.x86_64-linux; runCommand "hestia-probe-${builtins.getEnv "PROBE"}" {} "echo hi > $out"' 2>&1 | tee build.log
          grep -q "from 'http://127.0.0.1" build.log
      - name: Hestia serve log
        if: always()
        run: cat "$HESTIA_SERVE_LOG" || true
